<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Wallet Example</title>
</head>
<body>
  <button id="connectWalletBtn" style="padding:10px 20px; background:#4A90E2; color:#fff; border:none; border-radius:4px; cursor:pointer;">
    Connect Wallet
  </button>

  <script type="module">
    import { createAppKit } from 'https://cdn.jsdelivr.net/npm/@reown/appkit/dist/index.esm.js';
    import { EthersAdapter } from 'https://cdn.jsdelivr.net/npm/@reown/appkit-adapter-ethers/dist/index.esm.js';
    import { mainnet } from 'https://cdn.jsdelivr.net/npm/@reown/appkit/networks/dist/index.esm.js';

    const projectId = 'f76f0bcabf40fadb066240a1c96eff76';  // bu sizning loyihangizga berilgan ID

    const metadata = {
      name: 'My Web3 Site',
      description: 'Example using Reown AppKit',
      url: window.location.origin,
      icons: [ ${window.location.origin}/icon.png ]  // agar icon bo‘lsa
    };

    const modal = createAppKit({
      adapters: [ new EthersAdapter() ],
      networks: [ mainnet ],
      projectId,
      metadata,
      features: {
        analytics: true
      }
    });

    document.getElementById('connectWalletBtn')
      .addEventListener('click', async () => {
        await modal.open();
        console.log('Wallet connect modal opened');
      });
  </script>
</body>
