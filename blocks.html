<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Swap with WalletConnect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .swap-box {
            max-width: 500px;
            margin: 20px auto;
            background: #2d2d2d;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #444;
        }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }
        .btn-wallet { 
            background: #3396FF; 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-success { background: #4CAF50; color: white; }
        
        #status { 
            margin: 15px 0; 
            padding: 12px; 
            border-radius: 8px;
            text-align: center;
        }
        .success { background: #4CAF50; }
        .error { background: #f44336; }
        .info { background: #2196F3; }
        
        .wallet-info {
            margin: 15px 0;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            text-align: center;
        }
        
        .qr-container {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="swap-box">
        <h2>💰 WalletConnect Demo</h2>
        
        <!-- WalletConnect Connection -->
        <button id="walletConnectBtn" class="btn btn-wallet">
            🔗 Connect with WalletConnect
        </button>

        <!-- QR Code Container -->
        <div id="qrContainer" class="qr-container" style="display: none;">
            <p>Scan with your wallet app:</p>
            <div id="qrcode"></div>
        </div>

        <!-- Wallet Info -->
        <div id="walletInfo" class="wallet-info" style="display: none;">
            <strong>✅ Connected:</strong> <span id="walletAddress"></span>
        </div>

        <!-- Swap Button -->
        <button id="swapBtn" class="btn btn-success" disabled>
            🔄 Swap Tokens
        </button>
        
        <!-- Status -->
        <div id="status" class="info">Click "Connect with WalletConnect"</div>
    </div>

    <!-- WalletConnect Library -->
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>

    <script>
        let walletConnect = null;
        let web3 = null;
        let userAddress = null;

        // DOM elements
        const walletConnectBtn = document.getElementById('walletConnectBtn');
        const qrContainer = document.getElementById('qrContainer');
        const walletInfo = document.getElementById('walletInfo');
        const walletAddress = document.getElementById('walletAddress');
        const statusDiv = document.getElementById('status');
        const swapBtn = document.getElementById('swapBtn');

        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        // Initialize WalletConnect
        async function initWalletConnect() {
            try {
                updateStatus('Initializing WalletConnect...', 'info');
                
                // WalletConnect configuration
                walletConnect = new WalletConnectProvider.default({
                    rpc: {
                        1: "https://mainnet.infura.io/v3/YOUR_PROJECT_ID", // Ethereum
                        56: "https://bsc-dataseed.binance.org/", // BSC
                        137: "https://polygon-rpc.com/" // Polygon
                    },
                    bridge: "https://bridge.walletconnect.org",
                    qrcodeModal: false // We'll handle QR code ourselves
                });

                // Check if already connected
                if (walletConnect.connected) {
                    await useWalletConnect();
                    return;
                }

                // Create QR code
                await walletConnect.enable();
                createQRCode(walletConnect.connector.uri);
                
            } catch (error) {
                console.error('WalletConnect init error:', error);
                updateStatus('Failed to initialize WalletConnect', 'error');
            }
        }

        // Create QR Code
        function createQRCode(uri) {
            qrContainer.style.display = 'block';
            const qrElement = document.getElementById('qrcode');
            qrElement.innerHTML = '';
            
            QRCode.toCanvas(qrElement, uri, { width: 200 }, (error) => {
                if (error) {
                    console.error('QR code error:', error);
                    updateStatus('QR code generation failed', 'error');
                    return;
                }
                updateStatus('Scan QR code with your wallet app', 'info');
            });
        }

        // Use WalletConnect connection
        async function useWalletConnect() {
            try {
                updateStatus('Connecting to wallet...', 'info');
                
                web3 = new Web3(walletConnect);
                
                // Get accounts
                const accounts = await web3.eth.getAccounts();
                
                if (accounts.length === 0) {
                    updateStatus('No accounts found', 'error');
                    return;
                }

                userAddress = accounts[0];
                
                // Show wallet info
                const displayAddress = userAddress.substring(0, 8) + '...' + userAddress.substring(userAddress.length - 6);
                walletAddress.textContent = displayAddress;
                walletInfo.style.display = 'block';
                swapBtn.disabled = false;
                
                updateStatus('✅ Wallet connected via WalletConnect!', 'success');
                qrContainer.style.display = 'none';

                // Listen for events
                walletConnect.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        disconnectWallet();
                    } else {
                        userAddress = accounts[0];
                        walletAddress.textContent = userAddress.substring(0, 8) + '...' + userAddress.substring(userAddress.length - 6);
                    }
                });

                walletConnect.on('chainChanged', (chainId) => {
                    updateStatus(`Network changed: ${chainId}`, 'info');
                });

                walletConnect.on('disconnect', () => {
                    disconnectWallet();
                });

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('Connection failed: ' + error.message, 'error');
            }
        }

        // Disconnect wallet
        function disconnectWallet() {
            if (walletConnect) {
                walletConnect.disconnect();
            }
            userAddress = null;
            web3 = null;
            walletInfo.style.display = 'none';
            swapBtn.disabled = true;
            updateStatus('Wallet disconnected', 'error');
        }

        // Execute swap using WalletConnect
        async function executeSwap() {
            try {
                if (!userAddress || !web3) {
                    updateStatus('Please connect wallet first', 'error');
                    return;
                }

                updateStatus('🔄 Processing swap...', 'info');
                swapBtn.disabled = true;

                // Simulate transaction (in real app, you'd use actual contract calls)
                const transaction = {
                    from: userAddress,
                    to: "0x742E6f70B97580E72211c9c9A2d2776cA7c8b1E1", // Example address
                    value: web3.utils.toWei('0.001', 'ether'),
                    gas: 21000
                };

                // Send transaction (this will trigger wallet approval on mobile)
                const txHash = await web3.eth.sendTransaction(transaction);
                
                updateStatus(`✅ Swap successful! TX: ${txHash.transactionHash.substring(0, 10)}...`, 'success');
                
                swapBtn.disabled = false;

            } catch (error) {
                console.error('Swap error:', error);
                updateStatus('❌ Swap failed: ' + error.message, 'error');
                swapBtn.disabled = false;
            }
        }

        // Event listeners
        walletConnectBtn.addEventListener('click', initWalletConnect);
        swapBtn.addEventListener('click', executeSwap);

        // Check existing connection on load
        async function checkExistingConnection() {
            // You can implement reconnection logic here
        }

        document.addEventListener('DOMContentLoaded', checkExistingConnection);
    </script>
</body>
</html>
