<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lethex</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="swap.css">
</head>
<body>
    <!-- Header & Navigation -->
    <header class="cd-header">
        <div class="header-wrapper">
            <div class="logo-wrap">
                <div class="svg_logo">
                    <svg class="curen_color dis" viewBox="500 400 500 800" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 556,432 L 556,868 ..." fill="currentColor" />
                    </svg>
                </div>
                <span class="letai">ethex</span>
            </div>
            <div class="nav-but-wrap">
                <div class="menu-icon hover-target">
                    <span class="menu-icon__line menu-icon__line-left"></span>
                    <span class="menu-icon__line"></span>
                    <span class="menu-icon__line menu-icon__line-right"></span>
                </div>
            </div>
        </div>
    </header>

    <div class="nav">
        <div class="nav__content">
            <ul class="nav__list">
                <li class="nav__list-item"><a href="/index.html" class="hover-target">home</a></li>
                <li class="nav__list-item"><a href="/trx.html" class="hover-target">Trx</a></li>
                <li class="nav__list-item active-nav"><a href="#" class="hover-target">swap</a></li>
                <li class="nav__list-item"><a href="/contact.html" class="hover-target">contact</a></li>
            </ul>
            <div class="switch-wrap nav__list-item">
                <div id="switch" class="hover-target">
                    <div id="circle"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Swap Section -->
    <section class="section full-height over-hide swap-section">
        <div class="container text-center">
            <h2 class="mb-4">Swap Tokens</h2>
            <div class="swap-box">
                <div class="form-group">
                    <label for="fromTokenSelect">From Token</label>
                    <select id="fromTokenSelect" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="toTokenSelect">To Token</label>
                    <select id="toTokenSelect" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="swapAmount">Amount</label>
                    <input type="number" id="swapAmount" class="form-control" placeholder="Enter amount">
                </div>
                <button id="connectWalletBtn" class="btn btn-primary mt-2">Connect Wallet</button>
                <div id="walletAddress" class="mt-2 mb-2"></div>
                <button id="swapBtn" class="btn btn-success">Swap</button>
                <div id="swapStatus" class="mt-2"></div>
            </div>
        </div>
    </section>

    <!-- Cursors -->
    <div class='cursor' id="cursor"></div>
    <div class='cursor2' id="cursor2"></div>
    <div class='cursor3' id="cursor3"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.11.2/dist/index.min.js"></script>
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <script src="script.js"></script>
</body>
</html>
