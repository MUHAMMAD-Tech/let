<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Reliable CDN Version</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            text-align: center;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #337CCF;
            color: white;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { 
            margin: 20px; 
            padding: 15px; 
            border-radius: 8px;
            background: #333;
        }
    </style>
</head>
<body>
    <h2>🔗 Trust Wallet Connect</h2>
    <p>Using reliable CDN sources</p>
    
    <button id="connectBtn" class="btn" disabled>Loading Libraries...</button>
    <div id="qrcode" style="margin: 20px;"></div>
    <div id="status">Initializing...</div>

    <!-- High-reliability CDN sources -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.9.0/dist/umd/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

    <script>
        let provider = null;

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? '#d32f2f' : '#2d2d2d';
            status.style.color = isError ? 'white' : 'white';
            console.log(message);
        }

        function enableConnectButton() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = false;
            btn.textContent = '🔗 Connect Trust Wallet';
        }

        async function initialize() {
            try {
                // Check if all libraries are loaded
                if (typeof ethers === 'undefined') {
                    throw new Error('Ethers.js not loaded');
                }
                if (typeof EthereumProvider === 'undefined') {
                    throw new Error('WalletConnect not loaded');
                }
                if (typeof QRCode === 'undefined') {
                    throw new Error('QRCode not loaded');
                }

                updateStatus('✅ All libraries loaded!');
                enableConnectButton();

                // Initialize WalletConnect
                provider = await EthereumProvider.init({
                    projectId: "f76f0bcabf40fadb066240a1c96eff76",
                    chains: [1],
                    showQrModal: false
                });

                provider.on("display_uri", (uri) => {
                    document.getElementById('qrcode').innerHTML = '';
                    QRCode.toCanvas(document.getElementById('qrcode'), uri, { width: 200 }, (err) => {
                        if (err) console.error(err);
                    });
                    updateStatus('📱 Scan QR code with Trust Wallet');
                });

                provider.on("connect", () => {
                    updateStatus('✅ Connected successfully!');
                    document.getElementById('connectBtn').textContent = '✅ Connected';
                    document.getElementById('connectBtn').disabled = true;
                });

                updateStatus('✅ Ready to connect!');

            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, true);
                console.error('Initialization error:', error);
            }
        }

        async function connect() {
            try {
                updateStatus('🔗 Connecting...');
                await provider.connect();
            } catch (error) {
                updateStatus(`❌ Connection failed: ${error.message}`, true);
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connect);

        // Start initialization when page loads
        document.addEventListener('DOMContentLoaded', initialize);

        // Fallback if libraries don't load
        setTimeout(() => {
            if (document.getElementById('connectBtn').disabled) {
                updateStatus('⚠️ Libraries taking too long. Please refresh the page.', true);
            }
        }, 10000);
    </script>
</body>
</html>
