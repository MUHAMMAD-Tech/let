<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Deep Link</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            text-align: center;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #337CCF;
            color: white;
        }
        .url-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>🔗 Trust Wallet Deep Link</h2>
    
    <button class="btn" onclick="openTrustWallet()">Open in Trust Wallet</button>
    <button class="btn" onclick="openMetaMask()">Open in MetaMask</button>
    <button class="btn" onclick="copyUrl()">📋 Copy URL</button>
    
    <div class="url-box">
        <strong>Current URL:</strong><br>
        <span id="currentUrl"></span>
    </div>
    
    <div id="status">Click a button above</div>

    <script>
        // Display current URL
        document.getElementById('currentUrl').textContent = window.location.href;

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function openTrustWallet() {
            const currentUrl = encodeURIComponent(window.location.href);
            const trustLink = `https://link.trustwallet.com/open_url?coin=60&url=${currentUrl}`;
            
            updateStatus('🔄 Opening Trust Wallet...');
            
            // Try to open deep link
            window.location.href = trustLink;
            
            // Fallback after delay
            setTimeout(() => {
                window.open(trustLink, '_blank');
                updateStatus('⚠️ If Trust Wallet didn\'t open, copy the URL above and paste in Trust Wallet browser');
            }, 500);
        }

        function openMetaMask() {
            const metamaskLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
            
            updateStatus('🔄 Opening MetaMask...');
            window.location.href = metamaskLink;
            
            setTimeout(() => {
                window.open(metamaskLink, '_blank');
            }, 500);
        }

        function copyUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                updateStatus('✅ URL copied! Paste this in your wallet browser');
            }).catch(() => {
                updateStatus('❌ Copy failed. Please copy the URL manually');
            });
        }

        // Auto-detect if we're in a wallet
        if (typeof window.ethereum !== 'undefined') {
            updateStatus('✅ Wallet detected! Ready to connect.');
            
            // Auto-connect if in wallet
            setTimeout(async () => {
                try {
                    const accounts = await window.ethereum.request({
                        method: 'eth_requestAccounts'
                    });
                    if (accounts.length > 0) {
                        updateStatus(`✅ Connected: ${accounts[0].substring(0, 10)}...`);
                    }
                } catch (error) {
                    console.log('Auto-connect failed:', error);
                }
            }, 1000);
        }
    </script>
</body>
</html>
