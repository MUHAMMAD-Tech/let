<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Simple v1</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            text-align: center;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #337CCF;
            color: white;
        }
        #status { 
            margin: 20px; 
            padding: 15px; 
            border-radius: 8px;
            background: #333;
        }
    </style>
</head>
<body>
    <h2>🔗 Trust Wallet Connect (Simple v1)</h2>
    <button id="connectBtn" class="btn">Connect Wallet</button>
    <div id="qrcode"></div>
    <div id="status">Click connect to start</div>

    <!-- WalletConnect v1 - More reliable -->
    <script src="https://unpkg.com/@walletconnect/client@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        let connector = null;

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }

        async function connectWallet() {
            try {
                updateStatus('🔄 Creating connection...');
                
                // Create WalletConnect v1 connector
                connector = new WalletConnect({
                    bridge: "https://bridge.walletconnect.org", // Official bridge
                    qrcodeModal: false
                });

                // Check if connection is already established
                if (!connector.connected) {
                    // Create new session
                    updateStatus('📱 Generating QR code...');
                    await connector.createSession();

                    // Display QR Code
                    showQRCode(connector.uri);
                }

                // Subscribe to connection events
                connector.on("connect", (error, payload) => {
                    if (error) {
                        throw error;
                    }

                    // Get connected account
                    const { accounts } = payload.params[0];
                    updateStatus(`✅ Connected: ${accounts[0].substring(0, 10)}...`);
                    document.getElementById('connectBtn').textContent = '✅ Connected';
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('qrcode').innerHTML = '';
                });

                connector.on("session_update", (error, payload) => {
                    if (error) {
                        throw error;
                    }
                    const { accounts } = payload.params[0];
                    updateStatus(`🔄 Session updated: ${accounts[0].substring(0, 10)}...`);
                });

                connector.on("disconnect", (error, payload) => {
                    if (error) {
                        throw error;
                    }
                    updateStatus('🔌 Disconnected');
                    document.getElementById('connectBtn').textContent = 'Connect Wallet';
                    document.getElementById('connectBtn').disabled = false;
                });

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus(`❌ Error: ${error.message}`);
            }
        }

        function showQRCode(uri) {
            const qrElement = document.getElementById('qrcode');
            qrElement.innerHTML = '';
            QRCode.toCanvas(qrElement, uri, { width: 200 }, (err) => {
                if (err) {
                    console.error('QR error:', err);
                    updateStatus('❌ QR code failed');
                } else {
                    updateStatus('📱 Scan QR code with Trust Wallet');
                console.log('QR Code URI:', uri);
                // Also log URI for manual copy-paste
                    updateStatus(`📱 Scan QR or copy this in Trust Wallet: ${uri.substring(0, 50)}...`);
                }
            });
        }

        document.getElementById('connectBtn').addEventListener('click', connectWallet);

        // Check for existing connection on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Try to initialize with existing connection
            try {
                const existingConnector = new WalletConnect({
                    bridge: "https://bridge.walletconnect.org",
                    qrcodeModal: false
                });

                if (existingConnector.connected) {
                    const accounts = existingConnector.accounts;
                    updateStatus(`✅ Reconnected: ${accounts[0].substring(0, 10)}...`);
                    document.getElementById('connectBtn').textContent = '✅ Connected';
                    document.getElementById('connectBtn').disabled = true;
                    connector = existingConnector;
                }
            } catch (error) {
                console.log('No existing connection');
            }
        });
    </script>
</body>
</html>
