<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WalletConnect Auto Connect</title>
  <script type="module">
    import { SignClient } from "https://unpkg.com/@walletconnect/sign-client@2.11.0/dist/index.modern.js";

    // ⚠️ Bu yerga o'zingning projectId'ni joylashtir!
    const PROJECT_ID = "f76f0bcabf40fadb066240a1c96eff76";

    // WalletConnect URI — bu seni DApp'dan kelgan link
    const WALLETCONNECT_URI = "wc:60aee1a2ee0933a28cb9c9ca7109434ade74679dac0447242aef735b5007d06d@2?relay-protocol=irn&symKey=bf5510c200fc1ad394e04caf4a127403ecb171075fb5ae557623ba03ebc28a28&expiryTimestamp=1761825695";

    async function connectWallet() {
      try {
        const client = await SignClient.init({
          projectId: PROJECT_ID,
          metadata: {
            name: "My DApp",
            description: "WalletConnect Demo",
            url: "https://example.org",
            icons: ["https://walletconnect.com/walletconnect-logo.png"]
          }
        });

        const session = await client.pair({ uri: WALLETCONNECT_URI });
        console.log("✅ WalletConnect session:", session);
        document.getElementById("status").textContent = "✅ Wallet ulandi!";
      } catch (err) {
        console.error("❌ Ulanishda xato:", err);
        document.getElementById("status").textContent = "❌ Ulanishda xato: " + err.message;
      }
    }

    window.onload = () => {
      document.getElementById("connectBtn").onclick = connectWallet;
    };
  </script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    button {
      background: #3b82f6;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h1>🔗 WalletConnect v2 Demo</h1>
  <button id="connectBtn">Walletni ulash</button>
  <p id="status"></p>
</body>
</html>
