<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet - Multiple CDN Fallbacks</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .btn {
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #337CCF;
            color: white;
            width: 100%;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #status { 
            margin: 20px 0; 
            padding: 15px; 
            border-radius: 8px;
            background: #333;
        }
        .library-status {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔗 Trust Wallet Connect</h2>
        <p>Multiple CDN Fallbacks</p>
        
        <div class="library-status">
            <h4>📚 Library Loading Status:</h4>
            <div id="libraryStatus">Loading libraries...</div>
        </div>
        
        <button id="connectBtn" class="btn" disabled>Loading Libraries...</button>
        <div id="qrcode" style="margin: 20px;"></div>
        <div id="status">Initializing...</div>
    </div>

    <!-- CDN 1: jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.9.0/dist/umd/index.min.js" onload="libraryLoaded('wc', 'jsDelivr')" onerror="tryCDN2()"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" onload="libraryLoaded('ethers', 'jsDelivr')"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" onload="libraryLoaded('qrcode', 'jsDelivr')"></script>

    <script>
        let provider = null;
        let loadedLibraries = {
            wc: false,
            ethers: false,
            qrcode: false
        };
        let currentCDN = 'jsDelivr';

        function updateLibraryStatus() {
            const status = document.getElementById('libraryStatus');
            const wcStatus = loadedLibraries.wc ? '✅' : '❌';
            const ethersStatus = loadedLibraries.ethers ? '✅' : '❌';
            const qrStatus = loadedLibraries.qrcode ? '✅' : '❌';
            
            status.innerHTML = `
                WalletConnect: ${wcStatus} (${currentCDN})<br>
                Ethers.js: ${ethersStatus}<br>
                QR Code: ${qrStatus}
            `;

            // Enable button if all libraries are loaded
            if (loadedLibraries.wc && loadedLibraries.ethers && loadedLibraries.qrcode) {
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('connectBtn').textContent = '🔗 Connect Trust Wallet';
                updateStatus('✅ All libraries loaded! Ready to connect.');
                initializeWalletConnect();
            }
        }

        function libraryLoaded(lib, cdn) {
            console.log(`${lib} loaded from ${cdn}`);
            loadedLibraries[lib] = true;
            currentCDN = cdn;
            updateLibraryStatus();
        }

        function tryCDN2() {
            console.log('CDN 1 failed, trying CDN 2...');
            // Remove any existing script
            const existingScript = document.querySelector('script[src*="walletconnect"]');
            if (existingScript) existingScript.remove();
            
            // Try CDN 2: unpkg
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/@walletconnect/ethereum-provider@2.9.0/dist/umd/index.min.js';
            script.onload = () => libraryLoaded('wc', 'unpkg');
            script.onerror = tryCDN3;
            document.head.appendChild(script);
        }

        function tryCDN3() {
            console.log('CDN 2 failed, trying CDN 3...');
            updateStatus('🔄 Trying alternative CDN sources...');
            
            // Try CDN 3: CDNJS (different build)
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/walletconnect/1.8.0/walletconnect-umd.min.js';
            script.onload = () => {
                console.log('Loaded WalletConnect v1 as fallback');
                loadedLibraries.wc = true;
                currentCDN = 'cdnjs-v1';
                updateLibraryStatus();
            };
            script.onerror = () => {
                updateStatus('❌ All CDNs failed. Please check your internet connection.', true);
            };
            document.head.appendChild(script);
        }

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.background = isError ? '#d32f2f' : '#2d2d2d';
            console.log(message);
        }

        async function initializeWalletConnect() {
            try {
                updateStatus('🚀 Initializing WalletConnect...');
                
                // Check which version of WalletConnect we have
                if (typeof EthereumProvider !== 'undefined') {
                    // WalletConnect v2
                    provider = await EthereumProvider.init({
                        projectId: "f76f0bcabf40fadb066240a1c96eff76",
                        chains: [1],
                        showQrModal: false,
                        methods: ["eth_sendTransaction", "personal_sign"],
                        events: ["chainChanged", "accountsChanged"]
                    });
                } else if (typeof WalletConnect !== 'undefined') {
                    // WalletConnect v1 (fallback)
                    updateStatus('⚠️ Using WalletConnect v1 (fallback)');
                    provider = new WalletConnect({
                        bridge: "https://bridge.walletconnect.org",
                        qrcodeModal: false
                    });
                } else {
                    throw new Error('No WalletConnect provider available');
                }

                // Set up event listeners
                if (provider.on) {
                    provider.on("display_uri", (uri) => {
                        showQRCode(uri);
                        updateStatus('📱 Scan QR code with Trust Wallet');
                    });

                    provider.on("connect", () => {
                        updateStatus('✅ Connected successfully!');
                        document.getElementById('connectBtn').textContent = '✅ Connected';
                        document.getElementById('connectBtn').disabled = true;
                    });
                }

                updateStatus('✅ WalletConnect initialized! Click connect.');

            } catch (error) {
                updateStatus(`❌ Initialization failed: ${error.message}`, true);
            }
        }

        function showQRCode(uri) {
            const qrElement = document.getElementById('qrcode');
            qrElement.innerHTML = '';
            QRCode.toCanvas(qrElement, uri, { width: 200 }, (err) => {
                if (err) {
                    console.error('QR error:', err);
                    updateStatus('❌ QR code generation failed', true);
                }
            });
        }

        async function connect() {
            try {
                updateStatus('🔗 Connecting...');
                
                if (!provider) {
                    await initializeWalletConnect();
                }

                if (provider.connect) {
                    await provider.connect();
                } else if (provider.enable) {
                    await provider.enable();
                } else {
                    throw new Error('No connect method available');
                }

            } catch (error) {
                updateStatus(`❌ Connection failed: ${error.message}`, true);
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connect);

        // Timeout check
        setTimeout(() => {
            if (!loadedLibraries.wc) {
                updateStatus('⚠️ WalletConnect loading slowly. Still trying...');
            }
        }, 5000);
    </script>
</body>
</html>
