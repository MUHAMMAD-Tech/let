<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Swap DApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .swap-box {
            max-width: 500px;
            margin: 20px auto;
            background: #2d2d2d;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #444;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-weight: bold; }
        select, input {
            width: 100%;
            padding: 15px;
            border: 1px solid #555;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }
        .btn-primary { background: #8153a9; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-wallet { 
            background: #333; 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .btn:active { transform: scale(0.98); }
        
        #status { 
            margin: 15px 0; 
            padding: 12px; 
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .success { background: #4CAF50; color: white; }
        .error { background: #f44336; color: white; }
        .info { background: #2196F3; color: white; }
        
        .wallet-info {
            margin: 15px 0;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .mobile-instructions {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.5;
        }
        
        h2 { text-align: center; margin-bottom: 10px; color: #8153a9; }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; }
        
        .qr-code {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="swap-box">
        <h2>💰 Mobile Swap</h2>
        <div class="subtitle">Swap tokens on your mobile wallet</div>
        
        <!-- Mobile Instructions -->
        <div class="mobile-instructions">
            <strong>📱 How to connect on MOBILE:</strong><br>
            1. <strong>Copy this URL</strong><br>
            2. <strong>Open your Wallet app</strong> (Trust, MetaMask, Phantom)<br>
            3. <strong>Paste URL</strong> in wallet's browser<br>
            4. Connect and start swapping
        </div>

        <!-- QR Code for Easy Mobile Access -->
        <div id="qrCode" class="qr-code">
            <p>Scan to open on mobile:</p>
            <!-- QR code will be generated here -->
            <div id="qrcode"></div>
        </div>

        <!-- Wallet Connection -->
        <div class="form-group">
            <label>Connect Your Wallet</label>
            
            <!-- Trust Wallet -->
            <button id="trustBtn" class="btn btn-wallet">
                <span style="font-size: 20px;">🔒</span>
                Trust Wallet
            </button>
            
            <!-- MetaMask Mobile -->
            <button id="metamaskBtn" class="btn btn-wallet">
                <span style="font-size: 20px;">🦊</span>
                MetaMask Mobile
            </button>
            
            <!-- Phantom Mobile -->
            <button id="phantomBtn" class="btn btn-wallet">
                <span style="font-size: 20px;">👻</span>
                Phantom Mobile
            </button>
            
            <!-- WalletConnect -->
            <button id="walletconnectBtn" class="btn btn-wallet">
                <span style="font-size: 20px;">🔗</span>
                WalletConnect
            </button>
            
            <!-- Generic Wallet -->
            <button id="genericBtn" class="btn btn-wallet">
                <span style="font-size: 20px;">💰</span>
                Other Wallet
            </button>
        </div>

        <!-- Current URL Display -->
        <div class="mobile-instructions" style="background: #3a3a3a;">
            <strong>📋 Current URL:</strong><br>
            <code id="currentUrl" style="font-size: 12px; word-break: break-all; color: #8153a9;"></code>
            <button onclick="copyUrl()" style="margin-top: 10px; padding: 8px; background: #8153a9; color: white; border: none; border-radius: 5px; cursor: pointer;">
                📋 Copy URL
            </button>
        </div>

        <!-- Swap Form -->
        <div class="form-group">
            <label for="fromToken">From Token</label>
            <select id="fromToken" class="form-control">
                <option value="ETH">ETH - Ethereum</option>
                <option value="BNB">BNB - Binance Coin</option>
                <option value="MATIC">MATIC - Polygon</option>
                <option value="USDT">USDT - Tether</option>
                <option value="USDC">USDC - USD Coin</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="toToken">To Token</label>
            <select id="toToken" class="form-control">
                <option value="USDT">USDT - Tether</option>
                <option value="USDC">USDC - USD Coin</option>
                <option value="ETH">ETH - Ethereum</option>
                <option value="BNB">BNB - Binance Coin</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" class="form-control" placeholder="0.0" step="0.001" min="0">
        </div>
        
        <!-- Wallet Info -->
        <div id="walletInfo" class="wallet-info">
            <strong>✅ Connected:</strong> <span id="walletAddress"></span>
        </div>
        
        <!-- Swap Button -->
        <button id="swapBtn" class="btn btn-success" disabled>
            🔄 Swap Tokens
        </button>
        
        <!-- Status -->
        <div id="status" class="info">Ready to connect wallet</div>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        console.log("📱 Mobile Swap DApp Loading...");
        
        // Global variables
        let userAddress = null;
        let isConnected = false;

        // DOM elements
        const trustBtn = document.getElementById('trustBtn');
        const metamaskBtn = document.getElementById('metamaskBtn');
        const phantomBtn = document.getElementById('phantomBtn');
        const walletconnectBtn = document.getElementById('walletconnectBtn');
        const genericBtn = document.getElementById('genericBtn');
        const swapBtn = document.getElementById('swapBtn');
        const walletInfo = document.getElementById('walletInfo');
        const walletAddress = document.getElementById('walletAddress');
        const statusDiv = document.getElementById('status');
        const amountInput = document.getElementById('amount');
        const currentUrlElement = document.getElementById('currentUrl');

        // Display current URL
        currentUrlElement.textContent = window.location.href;

        // Copy URL function
        function copyUrl() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                updateStatus('✅ URL copied to clipboard!', 'success');
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }

        // Update status
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = type;
            console.log(`Status: ${message}`);
        }

        // Detect mobile wallet - IMPROVED VERSION
        function detectMobileWallet() {
            const wallets = [];
            
            // Check for Ethereum providers
            if (typeof window.ethereum !== 'undefined') {
                wallets.push('ethereum');
                
                // Check specific wallets
                if (window.ethereum.isTrust) {
                    wallets.push('trust');
                }
                if (window.ethereum.isMetaMask) {
                    wallets.push('metamask');
                }
                if (window.ethereum.isCoinbaseWallet) {
                    wallets.push('coinbase');
                }
            }
            
            // Check for Solana wallets
            if (typeof window.solana !== 'undefined' && window.solana.isPhantom) {
                wallets.push('phantom');
            }
            if (typeof window.phantom !== 'undefined') {
                wallets.push('phantom');
            }
            
            // Check for Brave wallet
            if (typeof window.ethereum !== 'undefined' && window.ethereum.isBraveWallet) {
                wallets.push('brave');
            }
            
            console.log('Detected wallets:', wallets);
            return wallets;
        }

        // Connect to any Ethereum wallet - IMPROVED
        async function connectEthereumWallet(walletName) {
            try {
                updateStatus(`Connecting to ${walletName}...`, 'info');
                
                if (typeof window.ethereum === 'undefined') {
                    updateStatus(`${walletName} not detected. Opening app...`, 'info');
                    openWalletDeepLink(walletName);
                    return;
                }

                // Request accounts
                const accounts = await window.ethereum.request({
                    method: 'eth_requestAccounts'
                });

                if (accounts.length === 0) {
                    updateStatus('No accounts found', 'error');
                    return;
                }

                userAddress = accounts[0];
                isConnected = true;
                
                showWalletInfo(userAddress);
                updateStatus(`✅ ${walletName} connected successfully!`, 'success');
                
                // Listen for account changes
                window.ethereum.on('accountsChanged', (newAccounts) => {
                    if (newAccounts.length === 0) {
                        // User disconnected
                        userAddress = null;
                        isConnected = false;
                        walletInfo.style.display = 'none';
                        swapBtn.disabled = true;
                        updateStatus('Wallet disconnected', 'error');
                    } else {
                        // Account changed
                        userAddress = newAccounts[0];
                        showWalletInfo(userAddress);
                        updateStatus('Account changed', 'info');
                    }
                });
                
            } catch (error) {
                console.error('Connection error:', error);
                if (error.code === 4001) {
                    updateStatus('Connection rejected by user', 'error');
                } else {
                    updateStatus(`Connection failed: ${error.message}`, 'error');
                    // Fallback to deep link
                    openWalletDeepLink(walletName);
                }
            }
        }

        // Connect to Phantom - IMPROVED
        async function connectPhantom() {
            try {
                updateStatus('Connecting to Phantom...', 'info');
                
                const solana = window.solana || window.phantom;
                
                if (!solana) {
                    updateStatus('Phantom not detected. Opening app...', 'info');
                    openWalletDeepLink('phantom');
                    return;
                }

                // Only connect if not already connected
                if (!solana.isConnected) {
                    const response = await solana.connect();
                    userAddress = response.publicKey.toString();
                } else {
                    userAddress = solana.publicKey.toString();
                }
                
                isConnected = true;
                
                showWalletInfo(userAddress);
                updateStatus('✅ Phantom connected successfully!', 'success');
                
            } catch (error) {
                console.error('Phantom error:', error);
                updateStatus('Phantom connection failed', 'error');
                openWalletDeepLink('phantom');
            }
        }

        // Show wallet info
        function showWalletInfo(address) {
            const displayAddress = address.substring(0, 8) + '...' + address.substring(address.length - 6);
            walletAddress.textContent = displayAddress;
            walletInfo.style.display = 'block';
            swapBtn.disabled = false;
        }

        // Open wallet deep links - IMPROVED
        function openWalletDeepLink(walletName) {
            const currentUrl = encodeURIComponent(window.location.href);
            let deepLink = '';
            
            switch(walletName.toLowerCase()) {
                case 'trust wallet':
                case 'trust':
                    deepLink = `https://link.trustwallet.com/open_url?coin=60&url=${currentUrl}`;
                    break;
                case 'metamask':
                case 'metamask mobile':
                    deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
                    break;
                case 'phantom':
                    deepLink = `https://phantom.app/ul/browse/${currentUrl}`;
                    break;
                case 'wallet':
                default:
                    deepLink = window.location.href;
            }
            
            console.log(`Opening deep link for ${walletName}: ${deepLink}`);
            
            // Try to open deep link
            window.location.href = deepLink;
            
            // Fallback instructions
            updateStatus(`Please open this URL in your ${walletName} app`, 'info');
        }

        // Execute swap
        async function executeSwap() {
            try {
                const fromToken = document.getElementById('fromToken').value;
                const toToken = document.getElementById('toToken').value;
                const amount = amountInput.value;

                if (!amount || amount <= 0) {
                    updateStatus('Please enter valid amount', 'error');
                    return;
                }

                if (fromToken === toToken) {
                    updateStatus('Please select different tokens', 'error');
                    return;
                }

                if (!isConnected) {
                    updateStatus('Please connect wallet first', 'error');
                    return;
                }

                updateStatus('🔄 Processing swap...', 'info');
                swapBtn.disabled = true;
                
                // Simulate swap processing
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                const txHash = "0x" + Math.random().toString(16).substr(2, 64);
                updateStatus(`✅ Swap successful! TX: ${txHash.substring(0, 10)}...`, 'success');
                
                // Re-enable button after success
                setTimeout(() => {
                    swapBtn.disabled = false;
                }, 2000);

            } catch (error) {
                console.error('Swap error:', error);
                updateStatus('❌ Swap failed: ' + error.message, 'error');
                swapBtn.disabled = false;
            }
        }

        // Event listeners
        trustBtn.addEventListener('click', () => connectEthereumWallet('Trust Wallet'));
        metamaskBtn.addEventListener('click', () => connectEthereumWallet('MetaMask'));
        phantomBtn.addEventListener('click', connectPhantom);
        walletconnectBtn.addEventListener('click', () => {
            updateStatus('WalletConnect integration coming soon...', 'info');
        });
        genericBtn.addEventListener('click', () => connectEthereumWallet('Wallet'));
        
        swapBtn.addEventListener('click', executeSwap);
        
        amountInput.addEventListener('input', function() {
            if (isConnected) {
                swapBtn.disabled = !this.value || this.value <= 0;
            }
        });

        // Check existing connection - IMPROVED
        async function checkExistingConnection() {
            try {
                // Check Ethereum
                if (typeof window.ethereum !== 'undefined') {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        isConnected = true;
                        showWalletInfo(userAddress);
                        updateStatus('✅ Wallet reconnected', 'success');
                    }
                }
                
                // Check Phantom
                if ((window.solana || window.phantom) && (window.solana?.isConnected || window.phantom?.isConnected)) {
                    const solana = window.solana || window.phantom;
                    userAddress = solana.publicKey.toString();
                    isConnected = true;
                    showWalletInfo(userAddress);
                    updateStatus('✅ Phantom reconnected', 'success');
                }
                
            } catch (error) {
                console.log('No existing connection:', error.message);
            }
        }

        // Auto-detect wallets on load - IMPROVED
        function autoDetectWallets() {
            const detectedWallets = detectMobileWallet();
            
            if (detectedWallets.length === 0) {
                updateStatus('🌐 Open this page in your mobile wallet app for best experience', 'info');
            } else {
                updateStatus(`✅ Detected: ${detectedWallets.join(', ')}`, 'success');
            }
        }

        // Generate QR Code
        function generateQRCode() {
            if (typeof QRCode !== 'undefined') {
                const qrElement = document.getElementById('qrcode');
                qrElement.innerHTML = ''; // Clear previous QR
                QRCode.toCanvas(qrElement, window.location.href, { width: 200 }, function(error) {
                    if (error) console.error('QR Code error:', error);
                });
                document.getElementById('qrCode').style.display = 'block';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Mobile DApp loaded');
            checkExistingConnection();
            autoDetectWallets();
            generateQRCode();
            
            // Show helpful message based on device
            if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                updateStatus('📱 Mobile device detected. You can use wallet buttons!', 'success');
            } else {
                updateStatus('💻 Desktop detected. Copy URL to mobile wallet for best experience.', 'info');
            }
        });

        // Add touch improvements for mobile
        document.addEventListener('touchstart', function() {}, {passive: true});
    </script>
</body>
</html>
