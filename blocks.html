<!DOCTYPE html>
<html>
<head>
    <title>Simple Trust Wallet Connect</title>
    <script src="https://unpkg.com/@walletconnect/ethereum-provider@2.9.0/dist/umd/index.min.js"></script>
</head>
<body>
    <button onclick="simpleConnect()">Simple Connect</button>
    <div id="status"></div>

    <script>
        async function simpleConnect() {
            try {
                document.getElementById('status').textContent = 'Initializing...';
                
                const provider = await EthereumProvider.init({
                    projectId: "f76f0bcabf40fadb066240a1c96eff76",
                    chains: [1],
                    showQrModal: false
                });

                document.getElementById('status').textContent = 'Connecting...';
                await provider.connect();
                
                document.getElementById('status').textContent = 'Connected!';
                
            } catch (error) {
                document.getElementById('status').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
